# Private images contain locally supplied Apple SDKs; never publish them.
[build.env]
passthrough = ["MACOSX_DEPLOYMENT_TARGET", "IPHONEOS_DEPLOYMENT_TARGET", "SHINKI_EMU_PRODUCT_VERSION"]

[target.x86_64-apple-darwin]
image = "shinkirou/apple-cross:x86_64-apple-darwin-1.99.1"
[target.aarch64-apple-darwin]
image = "shinkirou/apple-cross:aarch64-apple-darwin-1.99.1"
[target.aarch64-apple-ios]
image = "shinkirou/apple-cross:aarch64-apple-ios-1.99.1"
[target.aarch64-apple-ios-sim]
image = "shinkirou/apple-cross:aarch64-apple-ios-sim-1.99.1"
[target.x86_64-apple-ios]
image = "shinkirou/apple-cross:x86_64-apple-ios-1.99.1"
